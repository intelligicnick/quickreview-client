<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Acrylic standee with QuickReview review QR">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a6dff"/>
      <stop offset="100%" stop-color="#1557d6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="600" fill="#f8fafc"/>
  <!-- standee panel 4×6 portrait -->
  <g filter="url(#shadow)" transform="translate(52 40)">
    <rect x="0" y="0" width="296" height="444" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="296" height="56" rx="12" fill="url(#accent)"/>
    <rect x="0" y="44" width="296" height="12" fill="url(#accent)"/>
    <text x="148" y="36" text-anchor="middle" fill="#fff" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em">QuickReview</text>
    <text x="148" y="88" text-anchor="middle" fill="#1557d6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Scan to leave a review</text>
    <!-- QR block -->
    <rect x="58" y="108" width="180" height="180" rx="8" fill="#fff" stroke="#1a6dff" stroke-width="3"/>
    <g fill="#0f172a">
      <rect x="70" y="120" width="44" height="44" rx="4"/>
      <rect x="78" y="128" width="28" height="28" fill="#fff"/>
      <rect x="84" y="134" width="16" height="16" fill="#1a6dff"/>
      <rect x="182" y="120" width="44" height="44" rx="4"/>
      <rect x="190" y="128" width="28" height="28" fill="#fff"/>
      <rect x="196" y="134" width="16" height="16" fill="#1a6dff"/>
      <rect x="70" y="232" width="44" height="44" rx="4"/>
      <rect x="78" y="240" width="28" height="28" fill="#fff"/>
      <rect x="84" y="246" width="16" height="16" fill="#1a6dff"/>
      <rect x="126" y="120" width="10" height="10"/><rect x="142" y="120" width="10" height="10"/><rect x="158" y="132" width="10" height="10"/>
      <rect x="126" y="148" width="10" height="10"/><rect x="150" y="148" width="18" height="10"/><rect x="174" y="156" width="10" height="10"/>
      <rect x="118" y="172" width="14" height="10"/><rect x="142" y="172" width="10" height="10"/><rect x="162" y="180" width="22" height="10"/>
      <rect x="126" y="196" width="10" height="10"/><rect x="146" y="204" width="10" height="10"/><rect x="166" y="196" width="18" height="10"/>
      <rect x="118" y="220" width="10" height="10"/><rect x="134" y="228" width="26" height="10"/><rect x="170" y="220" width="14" height="10"/>
      <rect x="126" y="244" width="18" height="10"/><rect x="154" y="252" width="10" height="10"/><rect x="174" y="244" width="10" height="10"/>
      <rect x="118" y="268" width="22" height="10"/><rect x="150" y="260" width="10" height="10"/><rect x="166" y="268" width="18" height="10"/>
    </g>
    <text x="148" y="318" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Your shop name · wired to your review page</text>
    <!-- stars -->
    <g fill="#fbbf24" transform="translate(98 340)">
      <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/>
      <polygon points="52,2 55,9 62,9 56,14 58,21 52,17 46,21 48,14 42,9 49,9"/>
      <polygon points="92,2 95,9 102,9 96,14 98,21 92,17 86,21 88,14 82,9 89,9"/>
      <polygon points="132,2 135,9 142,9 136,14 138,21 132,17 126,21 128,14 122,9 129,9"/>
      <polygon points="172,2 175,9 182,9 176,14 178,21 172,17 166,21 168,14 162,9 169,9"/>
    </g>
    <rect x="24" y="388" width="248" height="36" rx="18" fill="url(#accent)"/>
    <text x="148" y="412" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">quickreview.co.in</text>
    <!-- acrylic base -->
    <path d="M 88 444 L 148 468 L 208 444 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="148" cy="478" rx="72" ry="10" fill="#cbd5e1"/>
  </g>
  <text x="200" y="580" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">43 × 63 acrylic standee</text>
</svg>
