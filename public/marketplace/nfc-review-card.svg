<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="QuickReview NFC review card">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a6dff"/>
      <stop offset="100%" stop-color="#1557d6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="856" height="540" fill="#e2e8f0"/>
  <g filter="url(#shadow)" transform="translate(48 72)">
    <rect x="0" y="0" width="760" height="396" rx="24" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="760" height="72" rx="24" fill="url(#accent)"/>
    <rect x="0" y="56" width="760" height="16" fill="url(#accent)"/>
    <text x="380" y="46" text-anchor="middle" fill="#fff" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="800">QuickReview</text>
    <text x="40" y="118" fill="#1557d6" font-family="system-ui,sans-serif" font-size="22" font-weight="800">Tap or scan to review</text>
    <text x="40" y="148" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">NFC + QR · paired to your location</text>
    <rect x="40" y="168" width="200" height="200" rx="10" fill="#fff" stroke="#1a6dff" stroke-width="3"/>
    <g fill="#0f172a" transform="translate(52 180)">
      <rect x="0" y="0" width="48" height="48" rx="4"/>
      <rect x="8" y="8" width="32" height="32" fill="#fff"/>
      <rect x="14" y="14" width="20" height="20" fill="#1a6dff"/>
      <rect x="128" y="0" width="48" height="48" rx="4"/>
      <rect x="136" y="8" width="32" height="32" fill="#fff"/>
      <rect x="142" y="14" width="20" height="20" fill="#1a6dff"/>
      <rect x="0" y="128" width="48" height="48" rx="4"/>
      <rect x="8" y="136" width="32" height="32" fill="#fff"/>
      <rect x="14" y="142" width="20" height="20" fill="#1a6dff"/>
      <rect x="58" y="8" width="10" height="10"/><rect x="78" y="20" width="12" height="10"/><rect x="98" y="8" width="10" height="10"/>
      <rect x="54" y="36" width="14" height="10"/><rect x="76" y="44" width="10" height="10"/><rect x="96" y="36" width="18" height="10"/>
      <rect x="58" y="60" width="10" height="10"/><rect x="78" y="68" width="22" height="10"/><rect x="108" y="60" width="10" height="10"/>
      <rect x="54" y="84" width="18" height="10"/><rect x="82" y="92" width="10" height="10"/><rect x="102" y="84" width="14" height="10"/>
      <rect x="58" y="108" width="10" height="10"/><rect x="74" y="116" width="26" height="10"/><rect x="108" y="108" width="10" height="10"/>
      <rect x="54" y="132" width="22" height="10"/><rect x="86" y="140" width="10" height="10"/><rect x="106" y="132" width="12" height="10"/>
      <rect x="58" y="156" width="10" height="10"/><rect x="78" y="164" width="18" height="10"/><rect x="104" y="156" width="14" height="10"/>
    </g>
    <!-- NFC coil -->
    <g transform="translate(520 200)" fill="none" stroke="#1a6dff" stroke-width="3">
      <path d="M 0 80 Q 80 0 160 80 Q 240 160 160 240 Q 80 320 0 240 Q -80 160 0 80 Z" opacity="0.35"/>
      <path d="M 40 80 Q 80 40 120 80 Q 160 120 120 160 Q 80 200 40 160 Q 0 120 40 80 Z"/>
      <circle cx="80" cy="120" r="12" fill="#1a6dff" stroke="none"/>
    </g>
    <text x="600" y="360" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" font-weight="600">NFC tap</text>
    <g fill="#fbbf24" transform="translate(280 320)">
      <polygon points="16,4 20,14 30,14 22,20 24,30 16,24 8,30 10,20 2,14 12,14"/>
      <polygon points="56,4 60,14 70,14 62,20 64,30 56,24 48,30 50,20 42,14 52,14"/>
      <polygon points="96,4 100,14 110,14 102,20 104,30 96,24 88,30 90,20 82,14 92,14"/>
      <polygon points="136,4 140,14 150,14 142,20 144,30 136,24 128,30 130,20 122,14 132,14"/>
      <polygon points="176,4 180,14 190,14 182,20 184,30 176,24 168,30 170,20 162,14 172,14"/>
    </g>
    <text x="380" y="378" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12" font-weight="600">quickreview.co.in</text>
  </g>
  <text x="428" y="510" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="13">85.6 mm × 54 mm (CR80)</text>
</svg>
